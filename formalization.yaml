automation:
  methods:
    - method: "manual"
      framework: "Lean 4 and Mathlib"
      tool_setup: >-
        Human mathematical direction, source checking, integration, and
        release control, with Lean kernel checking and project-specific verification
        scripts.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local workstation and research host"
      prompting_notes: "n/a"
    - method: "agent"
      models:
        - "gpt-5.5"
        - "gpt-5.6-luna"
        - "gpt-5.6-sol"
        - "gpt-6-astra"
        - "claude-fable-5"
        - "claude-haiku-4-5-20251001"
        - "claude-opus-5[1m]"
        - "claude-opus-5"
      framework: "Codex and Claude Code"
      tool_setup: >-
        Agents assisted with mathematical research, proposed proofs and
        counterexamples, wrote and repaired Lean code, and ran the build,
        verifier and Comparator scripts.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local workstation, research host, and API services"
      prompting_notes: >-
        Under the author's direction, a controlling agent split the work into
        bounded proof tasks and integrated the accepted results.
  spend_usd: "not tracked"
  notes: >-
    Model use records process assistance and does not assign authorship of a
    mathematical idea.

fidelity:
  divergences: >-
    The formal theorem keeps the written noncommutative order
    1 = d*R + F*d*S and works over every characteristic-zero field. It includes
    n = 0 and replaces the manuscript's nonzero-nonunit restriction by the
    slightly stronger d != 0 restriction, since units are immediate. The
    fixed-source theorem is stated separately and requires positive rank for
    its linear Weyl coordinate.

review:
  status: "agent-reviewed"
  reviewers: []

alignment:
  namespace: "Stafford38"
  statements:
    - source: "Manuscript, Theorem 1.1"
      lean: "Stafford38.Paper.theorem_1_1"
      module: "Stafford38.Paper.Main"
      status: "proved"
      note: >-
        Compared as Stafford38Challenge.theorem_1_1, whose statement
        Stafford38Challenge.PaperTheorem_1_1 in Challenge.lean is Theorem 1.1
        as printed: the ideal form, the identity 1 = dR + FdS, and for n >= 1
        the source F = Phi_g^{-1}(x_1)^{deg_B d} for a linear
        omega-preserving g.
    - source: "Manuscript, Corollary 6.3 (Stafford 1978, Theorem 3.7)"
      lean: "Stafford38.Paper.corollary_6_3"
      module: "Stafford38.Paper.Main"
      status: "proved"
      note: >-
        Compared as Stafford38Challenge.corollary_6_3: every finitely
        generated torsion right A_n(k)-module is cyclic.
    - source: "Manuscript, Corollary 6.3, stable cyclicity (closing paragraph of the proof)"
      lean: "Stafford38.Paper.corollary_6_3_stablyCyclic"
      module: "Stafford38.Paper.Main"
      status: "proved"
      note: >-
        Compared as Stafford38Challenge.corollary_6_3_stablyCyclic: every
        finitely generated torsion right A_n(k)-module is stably cyclic in
        Stafford's sense.
    - source: "Manuscript, Section 7: left-handed identity 1 = Rd + SdF"
      lean: "Stafford38.Paper.Section7.leftHandedIdentity"
      module: "Stafford38.Paper.Section7"
      status: "proved"
      note: >-
        Compared as Stafford38Challenge.leftHandedIdentity. No printed proof;
        the Lean proof transposes Theorem 1.1 for the transpose of d.
    - source: "Manuscript, Section 7: Corollary 6.3 for left torsion modules"
      lean: "Stafford38.Paper.Section7.corollary_6_3_left"
      module: "Stafford38.Paper.Section7"
      status: "proved"
      note: >-
        Compared as Stafford38Challenge.corollary_6_3_left. No printed proof;
        the Lean proof makes the left module a right module through the
        transpose and applies Corollary 6.3.
    - source: "Manuscript, Section 7: the identity for differential operators on localizations of k[x_1, ..., x_n]"
      lean: "Stafford38.Paper.Section7.localizedDifferentialIdentity"
      module: "Stafford38.Paper.Section7"
      status: "proved"
      note: >-
        Compared as Stafford38Challenge.localizedDifferentialIdentity and, for
        principal opens, Laurent-polynomial coefficients and the fraction
        field, as principalOpenDifferentialIdentity,
        laurentDifferentialIdentity and fractionFieldDifferentialIdentity.
        No printed proof; the Lean proof clears a left denominator of each
        operator and applies Theorem 1.1 in A_n(k).
    - source: "Manuscript, Section 7: the identity with F = x^r for d = p^r - sum a_j x^(m_j)"
      lean: "Stafford38.Paper.Section7.evolutionaryIdentity"
      module: "Stafford38.Paper.Section7"
      status: "proved"
      note: >-
        Compared as Stafford38Challenge.evolutionaryIdentity. No printed proof;
        the Lean proof is an explicit Euler-root certificate and does not use
        Theorem 1.1.
    - source: "Original proof: universal Stafford 3.8 theorem"
      lean: "Stafford38.universalStatement"
      module: "Stafford38.FoundationClosure"
      status: "proved"
      note: >-
        For every characteristic-zero field, every n >= 0, and every nonzero d,
        proves the literal identity 1 = d*R + F*d*S.
    - source: "Stafford 1978, Conjecture 3.8"
      lean: "Stafford38.universalStatement"
      module: "Stafford38.FoundationClosure"
      status: "proved"
      note: >-
        The 1978 article is the background source of the conjecture, not a
        source for the new proof.
    - source: "Original proof: exact Bernstein-degree fixed-source theorem"
      lean: "Stafford38.universalFixedSourceStatement"
      module: "Stafford38.FoundationClosure"
      status: "proved"
      note: >-
        At positive rank, the source is a power of a linear Weyl coordinate
        with exponent equal to the Bernstein degree; the scalar branch has
        degree zero. The Mathlib-only compared form
        Stafford38FixedSourceChallenge.universalFixedSourceStatement, proved
        in FixedSourceSolution.lean, defines the degree intrinsically as the
        least span level of ordered PBW words containing the element.

acknowledgements: >-
  The formalization builds on Lean, Mathlib, and the AlgebraicAnalysis library.
  Comparator, lean4export, NanoDa, and Landrun provide the independent
  submission-checking path.
