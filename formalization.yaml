    Section 7 consequences: the left-handed identity, Corollary 6.3 for left
    modules, the identity for differential operators on localizations of
    polynomial rings and the evolutionary identity. The sorry counts exclude
    the deliberate placeholders of the compared theorems in Challenge.lean and
    FixedSourceChallenge.lean.
