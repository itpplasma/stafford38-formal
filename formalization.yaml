# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Stafford 3.8"
  description: >-
    Lean formalization of Stafford's Conjecture 3.8 for every
    characteristic-zero field and every Weyl-algebra rank, proving that each
    nonzero d admits F, R, and S with 1 = d*R + F*d*S. The development also
    proves an exact Bernstein-degree fixed-source strengthening and derived
    localization, adjoint, and evolutionary results.
  authors:
    - "Christopher Albert"
  responsible_maintainers:
    - "Christopher Albert"
  license: "Apache-2.0"

repository:
  role: "substantive-development"
  url: "https://github.com/itpplasma/stafford38-formal"
  registration_status: "private-candidate-not-registered"
  note: >-
    This private repository is the canonical substantive Stafford-specific
    formal development. It is not registered with Palomar.

classification:
  arxiv:
    - "math.RA"
  msc2020:
    - "16S32"

sources:
  - title: "Original proof of Stafford's Conjecture 3.8 in this formalization"
    authors:
      - "Christopher Albert"
    type: "original-proof"
    relationship: "other"
    note: >-
      The private manuscript and formal development are the first presentation
      of this proof. No public preprint or stable bibliographic identifier has
      been registered.
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "Module structure of Weyl algebras"
    authors:
      - "J. T. Stafford"
    type: "article"
    location: >-
      Journal of the London Mathematical Society (2) 18 (1978), 429-442,
      Conjecture 3.8
    relationship: "background"
    note: >-
      This article states Conjecture 3.8 and supplies historical background; it
      does not contain the proof formalized here.

