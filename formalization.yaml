# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Stafford 3.8"
  description: >-
    Lean formalization of Stafford's Conjecture 3.8 for every
    characteristic-zero field and every Weyl-algebra rank, proving that each
    nonzero d admits F, R, and S with 1 = d*R + F*d*S. The development also
    proves an exact Bernstein-degree fixed-source strengthening and derived
    localization, adjoint, and evolutionary results.
  authors:
    - name: "Christopher Albert"
      orcid: "0000-0003-4773-416X"
  responsible_maintainers:
    - name: "Christopher Albert"
      orcid: "0000-0003-4773-416X"
  license: "Apache-2.0"

repository:
  role: "substantive-development"
  url: "https://github.com/itpplasma/stafford38-formal"
  registration_status: "registered"
  palomar_id: "PALOMAR-2026-09-05-000007"
  palomar_version: 4
  palomar_url: "https://palomar-registry.org/entry?id=PALOMAR-2026-09-05-000007&version=4"

classification:
  arxiv:
    - "math.RA"
  msc2020:
    - "16S32"

sources:
  - title: "Original proof of Stafford's Conjecture 3.8 in this formalization"
    authors:
      - name: "Christopher Albert"
        orcid: "0000-0003-4773-416X"
    type: "original-proof"
    relationship: "other"
    note: >-
      The formal development follows the manuscript's proof: each numbered
      statement of Sections 2-6 is a declaration in Stafford38/Paper that
      states the printed claim, each printed proof is assembled paragraph by
      paragraph, and the compared theorems are proved through
      Stafford38.Paper.theorem_1_1 and Stafford38.Paper.corollary_6_3, the
      Section 7 consequences through Stafford38.Paper.Section7.
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "Module structure of Weyl algebras"
    authors:
      - "J. T. Stafford"
    type: "paper"
    location: >-
      Journal of the London Mathematical Society (2) 18 (1978), 429-442,
      Conjecture 3.8
    relationship: "background"
    note: >-
      This article states Conjecture 3.8 and supplies historical background; it
      does not contain the proof formalized here.
  - title: "Module structure of Weyl algebras"
    authors:
      - "Gwyn Bellamy"
    type: "paper"
    id: "10.1112/jlms.70373"
    location: >-
      Journal of the London Mathematical Society 113 (2026), no. 1, e70373,
      Section 3, Conjecture 3.4
    relationship: "background"
    note: >-
      A 2026 survey of module structure over Weyl algebras. It states the
      weaker cyclicity form of the conjecture, notes that Stafford's
      formulation is stronger, and reports the problem as open. It records the
      state of the art against which the result formalized here is read; it
      contains no proof of Conjecture 3.8.

related_formalizations: []

