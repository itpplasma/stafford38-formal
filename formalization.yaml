  allowed_axioms: ["propext", "Classical.choice", "Quot.sound"]

status:
  scope: >-
    The substantive development proves the universal right-ideal certificate
    for all characteristic-zero fields and all n >= 0, including the rank-zero
    field case, and proves the positive-rank fixed-source strengthening and the
    listed immediate corollaries. The snapshot also includes the manuscript's
    general tangent-limit, asymptotic-conormal, and coisotropic-set statements
    and independent consumers. The verified commit has passed an independent
    clone build, 19 endpoint axiom reports, nine literal consumer reports,
    finite regression oracles, transitive import audits, and Comparator with
    NanoDa and Lean kernel verification. Exact statement correspondence and
    verification evidence are linked in the verification metadata above.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"
  main_results:
    - declaration: "Stafford38.universalStatement"
      file: "Stafford38/FoundationClosure.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "Stafford38.universalFixedSourceStatement"
      file: "Stafford38/FoundationClosure.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      literature_dependencies: []

